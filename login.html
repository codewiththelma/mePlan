<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — MePlan+</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body class="auth-body">

  <div class="auth-container">
    <img src="logo.png" class="auth-logo" />

    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-sub">Log in to access your planner</p>

    <form id="loginForm" class="auth-form">
      <input id="loginEmail" type="text" placeholder="Email or Username" required />
      <input id="loginPassword" type="password" placeholder="Password" required />

      <button class="auth-btn" type="submit">
        Continue
      </button>
    </form>

    <p class="auth-switch">
      Don't have an account?
      <a href="signup.html">Create one</a>
    </p>

    <p id="authError" class="auth-error hidden"></p>
  </div>

  <script type="module" src="auth-login.js"></script>
</body>
</html>
